services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: party
      POSTGRES_PASSWORD: party
      POSTGRES_DB: party_invite
    ports: ["5432:5432"]
    volumes: ["party_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U party -d party_invite"]
      interval: 5s
      retries: 10
volumes:
  party_data:
